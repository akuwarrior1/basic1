[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "csv-names"
dynamic = ["version"]
description = "Read and format people's names from CSV files — a tiny, typed, dependency-free library and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akashdeep Gopinath" }]
keywords = ["csv", "names", "parsing", "formatting", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
csv-names = "csv_names.cli:main"

[project.urls]
Homepage = "https://github.com/akuwarrior1/basic1"
Documentation = "https://github.com/akuwarrior1/basic1#readme"
Issues = "https://github.com/akuwarrior1/basic1/issues"
Changelog = "https://github.com/akuwarrior1/basic1/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/csv_names/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_names"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep the typing.List/Union/Optional style used throughout
